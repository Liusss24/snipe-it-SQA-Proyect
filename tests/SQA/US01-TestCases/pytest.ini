[pytest]
testpaths = automated
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --screenshot=only-on-failure
    --output=evidence
markers =
    sistema: system-level tests (black-box)
    integracion: integration tests across modules
    negative: negative / boundary tests
    manual: manually executed tests (skipped in automated runs)
    high: high priority
    medium: medium priority
