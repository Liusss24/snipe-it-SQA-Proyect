[pytest]
testpaths = automated
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --html=reports/reporte.html
    --self-contained-html
markers =
    smoke: pruebas críticas de humo
    regression: pruebas de regresión completas
    assets: pruebas de gestión de activos
    checkout: pruebas de checkout y checkin
    concurrencia: pruebas de condiciones de carrera y acceso simultáneo
